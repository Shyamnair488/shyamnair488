<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26" role="img"><title>divider</title>
<defs>
<linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00f7ff"/><stop offset="1" stop-color="#7b2ff7"/>
</linearGradient>
<linearGradient id="g-warm" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#f1c40f"/>
</linearGradient>
<linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="dv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f7ff" stop-opacity="0"/><stop offset="0.5" stop-color="#00f7ff"/><stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style>
<rect x="0" y="12" width="1000" height="2" fill="url(#dv)" opacity="0.55"/><circle cy="13" r="5" fill="#00f7ff" filter="url(#glow)"><animate attributeName="cx" values="0;1000;0" dur="9s" repeatCount="indefinite"/></circle><circle cx="500.0" cy="13" r="3.5" fill="#ff4d8d"/>
</svg>
