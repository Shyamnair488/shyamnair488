<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img"><title>Shyam Nair — Full Stack  ·  Cloud &amp; DevOps  ·  IoT  ·  AI / ML</title>
<defs>
<linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00f7ff"/><stop offset="1" stop-color="#7b2ff7"/>
</linearGradient>
<linearGradient id="g-warm" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff4d8d"/><stop offset="1" stop-color="#f1c40f"/>
</linearGradient>
<linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#070b16"/><stop offset="0.55" stop-color="#101234"/>
  <stop offset="1" stop-color="#1a0f3a"/>
</linearGradient>
<linearGradient id="hero-name" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#00f7ff"/>
  <stop offset="1" stop-color="#7b2ff7"/>
</linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
</pattern>
<clipPath id="hero-clip"><rect width="1000" height="290" rx="20"/></clipPath>
</defs>
<style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style>

<g clip-path="url(#hero-clip)">
  <rect width="1000" height="290" fill="url(#hero-bg)"/>
  <rect width="1000" height="290" fill="url(#grid)"/>
  <circle cx="190" cy="70" r="120" fill="#00f7ff" opacity="0.30" filter="url(#blur)">
    <animate attributeName="cx" values="190;420;190" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="230" r="130" fill="#7b2ff7" opacity="0.40" filter="url(#blur)">
    <animate attributeName="cx" values="820;600;820" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="40" r="90" fill="#ff4d8d" opacity="0.22" filter="url(#blur)">
    <animate attributeName="cy" values="40;140;40" dur="12s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(830,145.0)"><circle r="58" fill="none" stroke="#00f7ff" stroke-opacity="0.35" stroke-dasharray="3 9"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/><circle cx="58" r="6" fill="#00f7ff" filter="url(#glow)"/></g><circle r="92" fill="none" stroke="#7b2ff7" stroke-opacity="0.35" stroke-dasharray="3 9"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite"/><circle cx="92" r="6" fill="#7b2ff7" filter="url(#glow)"/></g><circle r="126" fill="none" stroke="#ff4d8d" stroke-opacity="0.35" stroke-dasharray="3 9"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/><circle cx="126" r="6" fill="#ff4d8d" filter="url(#glow)"/></g>
    <circle r="34" fill="#0d1117" stroke="url(#g-accent)" stroke-width="2"/>
    <text x="0" y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#e6edf3">SN</text>
  </g>
  <text x="62" y="122" font-size="78" font-weight="800" letter-spacing="3" fill="url(#hero-name)">SHYAM NAIR</text>
  <rect x="64" y="142" width="150" height="4" rx="2" fill="url(#g-warm)">
    <animate attributeName="width" values="30;220;30" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="188" font-size="21" fill="#b6c2d0" letter-spacing="0.5">Full Stack  ·  Cloud &amp; DevOps  ·  IoT  ·  AI / ML</text>
  <text class="m" x="64" y="232" font-size="25" fill="#00f7ff" opacity="1"><tspan fill="#ff4d8d">&gt;</tspan> building full stack web apps<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.1900;0.2000;1" dur="16.0s" begin="0.0s" repeatCount="indefinite"/></text><text class="m" x="64" y="232" font-size="25" fill="#00f7ff" opacity="0"><tspan fill="#ff4d8d">&gt;</tspan> deploying on AWS with Docker<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.1900;0.2000;1" dur="16.0s" begin="3.2s" repeatCount="indefinite"/></text><text class="m" x="64" y="232" font-size="25" fill="#00f7ff" opacity="0"><tspan fill="#ff4d8d">&gt;</tspan> wiring ESP8266 &amp; ESP32 gadgets<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.1900;0.2000;1" dur="16.0s" begin="6.4s" repeatCount="indefinite"/></text><text class="m" x="64" y="232" font-size="25" fill="#00f7ff" opacity="0"><tspan fill="#ff4d8d">&gt;</tspan> training vision &amp; speech models<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.1900;0.2000;1" dur="16.0s" begin="9.6s" repeatCount="indefinite"/></text><text class="m" x="64" y="232" font-size="25" fill="#00f7ff" opacity="0"><tspan fill="#ff4d8d">&gt;</tspan> shipping something new every week<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.1900;0.2000;1" dur="16.0s" begin="12.8s" repeatCount="indefinite"/></text>
  <rect x="64" y="244" width="14" height="3" fill="#00f7ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
<rect x="1" y="1" width="998" height="288" rx="20" fill="none" stroke="#30363d" stroke-width="2"/>

</svg>
